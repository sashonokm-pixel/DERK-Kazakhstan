name: DERK Content Intelligence - Discovery Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - feature-content-intelligence
    paths:
      - '.github/workflows/derk-content-monitor.yml'
      - 'content_intelligence/**'

permissions:
  contents: write

jobs:
  discovery-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: feature-content-intelligence

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 trafilatura langdetect pandas scikit-learn

      - name: Check DERK modules
        run: |
          python -m compileall -q content_intelligence
          python -c "from content_intelligence import collector, discovery, research_sources, classifier, thematic_analysis; print('DERK modules imported successfully')"

      - name: Confirm pilot source
        run: |
          python -c "from content_intelligence.research_sources import RESEARCH_SOURCES; print('Pilot website:', RESEARCH_SOURCES['Немцы']['website'])"

      - name: Discover Wiedergeburt publications
        run: |
          python - <<'PY'
          from content_intelligence.discovery import discover_candidates
          from content_intelligence.research_sources import RESEARCH_SOURCES

          website = RESEARCH_SOURCES["Немцы"]["website"]
          print("Checking website:", website)

          candidates = discover_candidates(website, limit=20)
          print("Candidate links found:", len(candidates))

          for number, article in enumerate(candidates, 1):
              print(number, article["title_hint"], article["url"])
          PY

      - name: Classify pages and build article corpus
        run: |
          python - <<'PY'
          from content_intelligence.classifier import build_corpus
          from content_intelligence.research_sources import RESEARCH_SOURCES

          website = RESEARCH_SOURCES["Немцы"]["website"]
          summary = build_corpus(website, limit=20, output_dir="derk_results")
          print("Classification results:")
          for key, value in summary.items():
              print(f"{key}: {value}")
          PY
      - name: Find latest 30 Wiedergeburt articles
        run: |
          python -m content_intelligence.latest_articles
      - name: Discover themes in article corpus
        run: |
          python content_intelligence/thematic_analysis.py derk_results/article_corpus.csv --output-dir derk_results/topic_results --topics 4

      - name: Calculate DERK content indicators
        run: |
          python -m content_intelligence.content_indicators
      - name: Preliminary coding of DERK publications
        run: |
           python -m content_intelligence.derk_preliminary_coding derk_results/article_corpus.csv --ethnos Немцы --out derk_results/content_preliminary_review.csv
      - name: Upload research CSV files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derk-wiedergeburt-corpus
          path: |
            derk_results/*.csv
            derk_results/topic_results/*.csv
          if-no-files-found: warn
          retention-days: 7
      - name: Save DERK results to experimental branch
        if: success() && github.ref == 'refs/heads/feature-content-intelligence'
        run: |
          mkdir -p data/content_intelligence
          cp derk_results/content_preliminary_review.csv data/content_intelligence/content_preliminary_review.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content_intelligence/content_preliminary_review.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update DERK preliminary content results [skip ci]"
            git push origin HEAD:feature-content-intelligence
          fi


